name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Installs from both lockfiles. The backend gets the base and dev groups only:
      # the `live` group (the Anthropic SDK) is never installed in CI.
      - run: make setup
      - run: make check

  # The one module that can spend (backend/app/model/live.py) imports the Anthropic SDK,
  # which the `check` job never installs. This job installs it for the type check only,
  # so that module is checked against the SDK's real types. It has no key and makes no
  # call: importing the SDK and constructing nothing cannot reach the network.
  types-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Type-check with the live dependency group installed
        working-directory: backend
        run: uv run --locked --group live mypy
      - name: The one test that needs the SDK present (live mode without a key fails at start)
        working-directory: backend
        run: uv run --locked --group live pytest -q -k live_mode_without_a_key

  # The existing browser check (scripts/browser-check.mjs) against a local `make dev`, which
  # forces demo mode: recordings are replayed, there is no key and no model call.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make setup
      - name: Start the app in demo mode and drive Chrome through it
        run: |
          make dev > dev.log 2>&1 &
          for attempt in $(seq 1 120); do
            curl -fsS -o /dev/null localhost:8000/health && curl -fsS -o /dev/null localhost:3000/ && break
            sleep 1
          done
          BASE=http://localhost:3000 CHROME="$(command -v google-chrome)" node scripts/browser-check.mjs \
            || { tail -n 40 dev.log; exit 1; }

  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the whole history, not just the tip
      - name: Install gitleaks
        run: |
          curl -sSLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/gitleaks" gitleaks
          rm gitleaks.tar.gz
      - run: '"$RUNNER_TEMP/gitleaks/gitleaks" git --redact --no-banner .'
