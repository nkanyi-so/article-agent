[project]
name = "article-agent-backend"
version = "0.1.0"
description = "Turns a transcript into a short article in which every sentence cites the transcript."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.164.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-socket>=0.8.1",
    "ruff>=0.17.5",
]
live = [
    "anthropic>=2.10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
# Every socket is blocked in every test. Unix sockets stay allowed because the
# asyncio event loop needs a local socket pair to wake itself; they cannot reach a network.
addopts = "--disable-socket --allow-unix-socket --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# These three hold the prompts. A prompt is sent exactly as written, so its lines are not
# wrapped to fit the code's line length.
"app/pipeline/draft.py" = ["E501"]
"app/pipeline/extract.py" = ["E501"]
"app/evals/judge.py" = ["E501"]
# Command-line tools run one call at a time; a blocking file read between calls is fine.
"tools/**" = ["ASYNC240"]

[tool.mypy]
strict = true
python_version = "3.14"
files = ["app", "tests", "tools"]
plugins = ["pydantic.mypy"]

# The Anthropic SDK lives in the optional `live` group and is deliberately absent from the
# environment that `make check` and CI use, so mypy cannot see it there. Only
# app/model/live.py imports it; with the live group installed mypy checks it in full.
[[tool.mypy.overrides]]
module = ["anthropic", "anthropic.*"]
ignore_missing_imports = true
